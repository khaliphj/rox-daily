name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installer handles a Mac with no iPhone attached
        run: |
          ROX_NO_OPEN=1 "./Install on iPhone.command" > installer.log 2>&1 || true
          cat installer.log
          grep -q "1/4 Looking for your iPhone" installer.log
          grep -q "No iPhone found" installer.log
          xcrun devicectl list devices --json-output devices.json >/dev/null 2>&1 || true
          python3 -c "import json; d=json.load(open('devices.json')); print(sorted(d['result'].keys())); assert isinstance(d['result']['devices'], list)"
      - name: Pick a simulator
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
      - name: Build and run UI tests
        run: |
          set -o pipefail
          xcodebuild test -project RoxDaily.xcodeproj -scheme RoxDaily -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEV" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error|failed|passed|Test Case|BUILD|TEST|\*\*" || true
          grep -q "TEST SUCCEEDED" build.log
      - name: Screenshots
        if: always()
        run: |
          set -x
          APP=$(find build/Build/Products -name RoxDaily.app | head -1)
          xcrun simctl uninstall "$DEV" com.roxdaily.trainer.k7q2 || true
          xcrun simctl install "$DEV" "$APP"
          mkdir shots
          xcrun simctl launch "$DEV" com.roxdaily.trainer.k7q2; sleep 8
          xcrun simctl io "$DEV" screenshot shots/0-splash.png
          xcrun simctl terminate "$DEV" com.roxdaily.trainer.k7q2
          for t in 0 1 2 3 4 5; do
            xcrun simctl launch "$DEV" com.roxdaily.trainer.k7q2 -demo -tab $t; sleep 9
            xcrun simctl io "$DEV" screenshot shots/tab-$t.png
            xcrun simctl terminate "$DEV" com.roxdaily.trainer.k7q2
          done
      - name: Publish screenshots to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p shots; cp build.log shots/ || true
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            build.log
            shots
